spring:
  servlet:
    multipart:
      max-file-size: 5MB   # 파일 하나당 최대 용량 (OOM 방지 최소 안전장치)
      max-request-size: 20MB  # 요청 하나(여러 파일 합산) 최대 용량
  datasource:
    url: jdbc:mysql://localhost:3308/ebrainsoft_study
    username: ebsoft
    password: ebsoft
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.study.board.entity,com.study.category.entity,com.study.comment.entity,com.study.file.entity
  configuration:
    map-underscore-to-camel-case: true

# 첨부 파일 저장 경로 설정
file:
  upload-dir: ./uploads

management:
  endpoint:
    health:
      show-details: always   # /actuator/health 에서 DB 연결 상태 등 세부 정보까지 보이게 함